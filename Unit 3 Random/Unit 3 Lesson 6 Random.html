    <!-- mcf-core.js 는 보통 상위 폴더(index.html·progress.js 옆)에 둔다.
         같은 폴더에 두는 경우도 있어 두 경로를 다 건다. 없는 쪽은 404 로 무시되고,
         둘 다 있으면 두 번째는 core 내부 가드가 막는다. -->
    <script src="../mcf-core.js"></script>
    <script src="mcf-core.js"></script>
    <script>
    /* core 를 못 찾으면 Generate 가 조용히 무반응이 된다. 원인이 안 보이므로 안내를 띄운다. */

    <script>

        /* ── mcf-core.js 로 옮겨간 이름들의 지역 별칭 ── */
        const randInt = MCF.randInt;
        const gcd = MCF.gcd;
        const gcd3 = MCF.gcd3;
        const mcfPick = MCF.pick;
        const mcfRich = MCF.rich;
        const mcfShuffle = MCF.shuffle;
        const mcfKey = MCF.key;
        const mcfDedupe = MCF.dedupe;
        const mcfFactorKey = MCF.factorKey;
        const mcfUniqueByValue = MCF.uniqueByValue;
        const mcfSpareOption = MCF.spareOption;
        const shuffleMC = MCF.shuffleMC;
        const M = MCF.M;
        const Mu = MCF.Mu;
        const fmtTerm = MCF.fmtTerm;
        /* --- audit fix: 같은 보기가 두 번 나오면 하나로 합친다.
           정답과 글자가 똑같은 보기를 골랐는데 오답 처리되는 것을 막는다. --- */
        /* Nudge one number inside an existing option to build a replacement
           distractor. Skips digit groups that follow a thousands separator, so
           "\\$11\\,045.96" is altered at the 11 and never left malformed.
           Uniqueness is checked by the caller, so this can never reproduce the
           correct answer. */
        /* Two options can differ only in whitespace -- an empty middle term leaves
           "4x^2  + 16" beside "4x^2 + 16" -- and MathJax renders them identically, so
           the student sees the same card twice and only one of them scores. Compare
           options on this normalised key, not on the raw string. */
        /* Picks one of several wordings for the same question. Types that only ever
           printed one sentence taught students to recognise the sentence instead of
           reading the maths. */




        const TEACHER_SPREADSHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwygR6-l7XPRC1KL-Pqci33Yw_4pmCWa8mW7gNHJ_RsmN41ax15-d0sE-CrIxU0z22m/exec";

        let globalScore = 0;
        let globalAttempts = 0;
        let currentProblemData = null;
        let currentState = { answered: false, selectedMcOption: "", isCorrect: false, currentStep: 0, solRevealed: false, attempts: 0 };
        let visibleStepElements = [];
        let currentStepIndex = 0;

        // --- Math & Logic Utilities ---


        function formatMoney(amount) {
            let parts = parseFloat(amount).toFixed(2).split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\\,");
            return "\\(\\$" + parts.join(".") + "\\)";
        }

        function formatNumber(num) {
            let parts = parseFloat(num).toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\\,");
            return parts.join(".");
        }

        // --- Problem Generators ---
        function generateProblem(typeId) {
            if (!typeId) return null;
            let p = {
                title: "", type: "mc", assetType: "none", optionType: "text",
                fullStatement: "", prompt: "", options: [], optionSpecs: [],
                hint: "", steps: [], ans: "", rawAns: ""
            };

            const scenario = randInt(1, 3);

            if (typeId === "t1") {
                p.title = "Future Value of an Annuity (Calculate FV)";
                let R, freq, freqStr, paymentStr, years, r_pct;

                if (scenario === 1) { freq = 4; freqStr = "quarterly"; paymentStr = "at the end of every quarter"; R = randInt(2, 8) * 100; years = randInt(4, 8); r_pct = randInt(36, 72) / 10; }
                else if (scenario === 2) { freq = 12; freqStr = "monthly"; paymentStr = "at the end of every month"; R = randInt(1, 5) * 50; years = randInt(3, 7); r_pct = randInt(24, 60) / 10; }
                else { freq = 1; freqStr = "annually"; paymentStr = "at the end of each year"; R = randInt(10, 40) * 100; years = randInt(5, 12); r_pct = randInt(40, 80) / 10; }

                const r = r_pct / 100;
                const i = r / freq;
                const n = years * freq;
                const base = 1 + i;
                /* i is usually a repeating decimal (0.043 / 12), and printing it raw put
                   "1.0035833333333333" on screen. That was ugly in every solution step and
                   it made the correct option the longest one every single time. Round for
                   display only -- the arithmetic keeps the exact value. */
                /* audit fix 2026-07-30: toFixed(6)은 소수점 자릿수라서, i가 0.0035 정도면
                   유효숫자가 4자리밖에 안 남는다. 그 값을 n(최대 300)제곱하는 과정에서
                   오차가 커져, 화면에 적힌 산술이 화면에 적힌 답을 내지 않았다
                   (t4는 최대 $50.84 차이). 유효숫자 10자리로 표시하면 센트까지 재현된다.
                   baseShow는 iShow에서 유도해야 Step 2와 Step 3의 숫자가 어긋나지 않는다. */
                const iShow = Number(i.toPrecision(10));
                const baseShow = Number((1 + iShow).toFixed(12));
                const rShow = Number(r.toPrecision(10));
                /* 반올림된 값 앞에서는 = 가 아니라 ≈ 라야 참이 된다 */
                const iRel = (Math.abs(iShow - i) <= Math.abs(i) * 1e-12) ? "=" : "\\approx";
                const factor = Math.pow(base, n);
                const factorShow = Number(factor.toPrecision(10));
                const FV = R * (factor - 1) / i;

                p.fullStatement = `An investor deposits \\(\\$${formatNumber(R)}\\) ${paymentStr} into an account. If the plan earns \\(${r_pct.toFixed(1)}\\%\\)/a interest compounded ${freqStr}, what is the total accumulated value of the plan after \\(${years}\\) years?`;
                p.prompt = mcfPick(["Select the correct total value (rounded to 2 decimal places):", "Which amount is in the account at the end (to the nearest cent)?", "Pick the final balance, rounded to two decimal places:"]);

                const correctStr = formatMoney(FV);
                /* audit fix 2026-07-30: freq === 1 이면 i === r 이고 n === years 라서
                   아래 두 오답이 정답과 완전히 같은 값이 된다. 그때 4개 보기 중 서로
                   다른 값이 2개뿐이 되고, dedupe가 채워 넣는 값이 전부 반올림된 정수라
                   "센트가 붙은 유일한 보기"가 정답이 되어버렸다. 연 1회 복리일 때는
                   다른 오해 모델로 바꾼다. */
                const dist1 = freq === 1
                    ? formatMoney(R * (factor - 1) / i * base)                // 기초 납입(annuity due)으로 착각
                    : formatMoney(R * (Math.pow(1 + r, years) - 1) / r);      // 연 단위로 착각
                const dist2 = formatMoney(R * n); // Just sum of payments
                const dist3 = freq === 1
                    ? formatMoney(R * (Math.pow(base, n - 1) - 1) / i)        // 기간 수를 하나 적게 셈
                    : formatMoney(R * (factor - 1) / r);                      // Divided by r instead of i

                const mc = shuffleMC(correctStr, [dist1, dist2, dist3]);
                p.options = mc.options; p.ans = mc.ansLetter;

                p.hint = `Use the Future Value of an Annuity formula: \\(FV = R \\times \\dfrac{(1 + i)^n - 1}{i}\\). Find ${freqStr} rate i and total periods n first.`;
                p.steps = [
                    { title: `Step 1: Decide Why This Needs the Annuity Formula`, math: `\\(R = ${R}, \\quad i = \\dfrac{${rShow}}{${freq}} ${iRel} ${iShow}, \\quad n = ${years} \\times ${freq} = ${n}\\)`, explanation: ( "Write down the payment R, the rate for one period i, and the number of periods n.") + ` An annuity is a run of equal payments, not one lump sum. So it needs the annuity formula, not the plain compound one. Sort the rate and periods out before substituting.`},
                    { title: "Step 2: Put the Numbers Into the Future Value Formula", math: `\\(FV = ${R} \\times \\dfrac{(1 + ${iShow})^{${n}} - 1}{${iShow}}\\)`, explanation: ( "Put those numbers into the future value formula for regular payments.") + ` The rate must be per period and the exponent must count periods. Trap: using the yearly rate when the payments are monthly.`},

        function buildOptionsHTML(problem, selectedLetter, disabled) {
            let html = '<div class="mc-options-list">';
            for (let i = 0; i < problem.options.length; i++) {
                const opt = problem.options[i];
                const letter = opt.charAt(0);
                const sel = selectedLetter === letter ? "selected" : "";
                const dis = disabled ? "disabled" : "";
                html += '<div class="mc-option-card ' + sel + ' ' + dis + '" onclick="selectMcOptionCard(\'' + letter + '\')"><span class="mc-badge">' + letter + '</span><span>' + opt.substring(3) + '</span></div>';
            }
            html += '</div>';
            return html;
        }
