    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #2563eb;
            --disabled-color: #94a3b8;
            --text-color: #334155;

            --border-color: #cbd5e1;

            --rule-bg: #fef08a;

            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;

        header {

            font-size: 1.05rem;

        .scoreboard {
            background-color: #1e293b;
            color: white;
            display: inline-flex;
            gap: 20px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        .scoreboard span {
            color: #60a5fa;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-box, .selector-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .profile-grid input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            outline: none;
        }

        .profile-grid input:focus {
            border-color: var(--secondary-color);
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .selector-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            flex: 1;
            padding: 16px;
            font-size: 1.1rem;
            font-family: inherit;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: white;
            color: var(--primary-color);
            outline: none;
            cursor: pointer;
        }

        .solution-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            font-style: italic;
            padding: 60px 0;
            font-size: 1.1rem;
        }

        .quiz-interface-box {
            background-color: var(--explanation-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .math-render-viewport {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .mc-option-card {
            background: white;
            border: 2px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;

        }

            border-color: var(--secondary-color);

            color: #1e40af;

            justify-content: center;

        }

        .quiz-action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .solution-reveal-window {
            display: none;
            border-top: 3px double var(--border-color);
            margin-top: 30px;
            padding-top: 30px;
        }

        .step-block {

            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: none;
        }

        .step-title {

            color: var(--secondary-color);

            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;

        .step-math {

            font-weight: 700;
            background-color: var(--explanation-bg);

            border-radius: 8px;

            align-items: center;
            gap: 8px;
            margin: 8px 0;
            color: var(--math-color);
            letter-spacing: 0.02em;
            flex-wrap: wrap;

        .step-explanation {

            font-size: 1.05rem;
            color: #334155;
            margin-top: 6px;

        .final-answer-box {
            background-color: var(--highlight-bg);
            border-left: 6px solid var(--secondary-color);
            padding: 20px 25px;
            border-radius: 0 8px 8px 0;
            margin-top: 30px;
            display: none;
        }

        .final-answer-label {
            font-weight: 800;
            color: var(--secondary-color);
            display: block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .final-answer-math {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 0.02em;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
            gap: 15px;
        }

        .btn {
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #1d4ed8; }
        .btn-success { background-color: var(--success-color); color: white; }

        .btn-secondary { background-color: var(--explanation-bg); color: var(--primary-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover:not(:disabled) { background-color: #e2e8f0; }
        .btn-accent { background-color: var(--primary-color); color: white; }
        .btn-accent:hover:not(:disabled) { background-color: #1e293b; }

        .btn:disabled {

        .question-statement-card {
            background: #ffffff;
            border-left: 4px solid var(--secondary-color);
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;

            border-left: 5px solid #eab308;
            color: #713f12;
            padding: 12px 16px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 15px;
            font-size: 1.05rem;
            font-weight: 600;

        .btn-hint { background-color: #fde047; color: #713f12; }
        .btn-hint:hover:not(:disabled) { background-color: #facc15; }

    </style>

    <script>

        /* ── mcf-core.js 로 옮겨간 이름들의 지역 별칭 ── */
        const randInt = MCF.randInt;
        const gcd = MCF.gcd;
        const gcd3 = MCF.gcd3;
        const mcfPick = MCF.pick;
        const mcfRich = MCF.rich;
        const mcfShuffle = MCF.shuffle;
        const mcfKey = MCF.key;
        const mcfDedupe = MCF.dedupe;
        const mcfFactorKey = MCF.factorKey;
        const mcfUniqueByValue = MCF.uniqueByValue;
        const mcfSpareOption = MCF.spareOption;
        const shuffleMC = MCF.shuffleMC;
        const M = MCF.M;
        const Mu = MCF.Mu;
        const fmtTerm = MCF.fmtTerm;
        /* --- audit fix: uniform in-place shuffle (Fisher-Yates) --- */

        /* --- audit fix: 같은 보기가 두 번 나오면 하나로 합친다.
           정답과 글자가 똑같은 보기를 골랐는데 오답 처리되는 것을 막는다. --- */
        /* Nudge one number inside an existing option to build a replacement
           distractor. Skips digit groups that follow a thousands separator, so
           "\\$11\\,045.96" is altered at the 11 and never left malformed.
           Uniqueness is checked by the caller, so this can never reproduce the
           correct answer. */
        /* Two options can differ only in whitespace -- an empty middle term leaves
           "4x^2  + 16" beside "4x^2 + 16" -- and MathJax renders them identically, so
           the student sees the same card twice and only one of them scores. Compare
           options on this normalised key, not on the raw string. */
        /* Picks one of several wordings for the same question. Types that only ever
           printed one sentence taught students to recognise the sentence instead of
           reading the maths. */




        const TEACHER_SPREADSHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwygR6-l7XPRC1KL-Pqci33Yw_4pmCWa8mW7gNHJ_RsmN41ax15-d0sE-CrIxU0z22m/exec";

        let globalScore = 0;
        let globalAttempts = 0;
        let currentProblemData = null;
        let currentState = { answered: false, selectedMcOption: "", isCorrect: false, currentStep: 0, solRevealed: false, attempts: 0 };
        let visibleStepElements = [];
        let currentStepIndex = 0;

        // --- Math & Logic Utilities ---


        /* Pick exactly three distractors that differ from each other and from the
           answer. Callers pass more candidates than they need, so a clash is
           replaced instead of silently shrinking the question to three options. */
        function distractors3(correct, candidates) {
            const seen = [String(correct)];
            const out = [];
            /* audit fix 2026-07-30: 앞에서부터 3개를 그대로 집어서, 후보를 4~5개
               써 둔 유형은 뒤쪽 후보가 학생에게 한 번도 가지 않았다. 복사본을
               섞은 뒤 고른다 (원본 배열은 건드리지 않는다). */
            const pool = mcfShuffle(candidates.slice());
            for (let i = 0; i < pool.length && out.length < 3; i++) {
                const c = String(pool[i]);
                if (seen.indexOf(c) !== -1) continue;
                seen.push(c);
                out.push(c);
            }
            if (out.length < 3) console.warn("distractors3: only " + out.length + " usable distractors");
            return out;
        }

        function formatMoney(amount) {
            let parts = parseFloat(amount).toFixed(2).split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\\,");
            return "\\(\\$" + parts.join(".") + "\\)";
        }

        /* audit fix 2026-07-30: 문제문이 **굵게** 표기를 쓰는데 이 파일에는 마크다운
           처리기가 없어서 화면에 별표가 그대로 찍혔다 (13개 유형, 110곳). */

        /* audit fix 2026-07-30: formatNumber는 LaTeX 얇은공백(\,)을 내보내므로
           \( \) 밖에 놓으면 백슬래시가 그대로 보인다. 수식 밖 숫자는 이쪽을 쓴다. */
        function formatNumberText(num) {
            let parts = parseFloat(num).toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join(".");
        }

        function formatNumber(num) {
            let parts = parseFloat(num).toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\\,");
            return parts.join(".");
        }

        // --- Infinite Problem Generator Factory ---
        function generateProblem(typeId) {
            if (!typeId) return null;
            let p = {
                title: "", type: "mc", assetType: "none", optionType: "text",
                fullStatement: "", prompt: "", options: [], hint: "", steps: [], ans: "", rawAns: ""
            };

            const scenario = randInt(1, 2);

            switch (typeId) {
                case "q1": {
                    const b = randInt(2, 9); const x = randInt(3, 6); const y = Math.pow(b, x);
                    p.title = "Parts of a Power";
                    p.fullStatement = MCF.pick([
                    `In the exponential expression \\\\(${b}^{${x}} = ${y}\\\\), which part is the **power**?`,
                    `Look at \\\\(${b}^{${x}} = ${y}\\\\). Which part of it is called the **power**?`,
                    `For \\\\(${b}^{${x}} = ${y}\\\\), identify which part the word **power** refers to.`
                ]);
                    p.prompt = mcfPick(["Select the part named in the question:", "Which choice names that part of the power?", "Pick the correct name for that part:"]);
                    const correctStr = `The whole expression \\(${b}^{${x}}\\), whose value is ${y}`;
                    const dist1 = `Only the base ${b}, which is the number being repeated`; const dist2 = `Only the exponent ${x}, which counts the repeats`; const dist3 = `The product ${b * x}, found by multiplying base and exponent`;
                    const mc = shuffleMC(correctStr, [dist1, dist2, dist3]);
                    p.options = mc.options; p.ans = mc.ansLetter;
                    p.hint = "Review core definitions: base is multiplied, exponent dictates cycles, and power represents the full evaluated whole.";
                    p.steps = [
                        { title: `Step 1: Work Out What the Two Parts Do`, math: `\\(\\text{Base} = ${b}\\)`, explanation: ( "The base number is the factor subjected to repeated self-multiplication.") + ` A power is made of two parts doing different jobs. The base is the number being multiplied, and the exponent counts how many times.`},
                        { title: "Step 2: Identify Exponent Component", math: `\\(\\text{Exponent} = ${x}\\)`, explanation: ( "The exponent indicates how many times the base factor is multiplied.") + ` The exponent sits raised and small. It is a count, not something you multiply by. Trap: reading it as a normal multiplication.`},
                        { title: `Step 3: Say What the Word Power Actually Means`, math: `\\(\\text{Power} = ${b}^{${x}} = ${y}\\)`, explanation: ( "The power is the entire exponential part comprising both base and exponent elements.") + ` The whole expression together is the power, and its value is what you get after multiplying it out. Trap: calling just the base or just the exponent the power.`}
                    ];
                    break;
                }
                case "q2": {
                    const b = randInt(2, 9);
                    const k = randInt(-6, 6);              /* vertical shift, sometimes 0 */
                    const down = randInt(1, 2) === 1;      /* reflected in the x-axis */
                    const kTerm = k === 0 ? "" : (k > 0 ? ` + ${k}` : ` - ${-k}`);
                    const fn = `f(x) = ${down ? "-" : ""}${b}^x${kTerm}`;

                    p.hint = "Calculate the total future value of the annuity first, then subtract the sum of all monthly principal deposits.";
                    p.steps = [
                        { title: `Step 1: Decide How to Get at the Interest`, math: `\\(i = \\dfrac{${r_pct/100}}{12} \\approx ${i.toFixed(6)}, \\quad n = ${n} \\implies FV = ${R} \\times \\dfrac{(1+${i.toFixed(6)})^{${n}} - 1}{${i.toFixed(6)}}\\)`, explanation: ( "Determine periodic rate, compounding periods, and evaluate future value amount.") + ` Total interest is not a formula on its own. Work out what the account grows to first, then take the deposits away at the end.`},
                        { title: "Step 2: Calculate Future Value Summation", math: `\\((1+${i.toFixed(6)})^{${n}} \\approx ${Math.pow(1+i, n).toFixed(6)} \\implies FV = ${FV.toFixed(2)}\\)`, explanation: ( ( `Evaluate the compound growth expression to find the total account balance of $${formatNumber(FV.toFixed(2))}.`) + ` Use the annuity formula with the per-period rate and the total number of payments. Keep several decimal places through the power.`) + ` Use the annuity formula with the per-period rate and the total number of payments. Keep several decimal places through the power.`},
                        { title: "Step 3: Subtract Total Principal Deposits", math: `\\(\\text{Deposits} = ${R} \\times ${n} = ${totalDeposits} \\implies I = ${FV.toFixed(2)} - ${totalDeposits} = ${interest.toFixed(2)}\\)`, explanation: ( ( "Subtract the total out-of-pocket deposits from the final balance to find the net interest earned.") + ` Add up every payment you made, then take that away from the final balance. What is left is the interest. Trap: giving the balance instead.`) + ` Add up every payment you made, then take that away from the final balance. What is left is the interest. Trap: giving the balance instead.`}
                    ];
                    break;
                }
                case "q18": {
                    p.title = "Half-Life Calculations";
                    const initial = randInt(8, 25) * 10;
                    const halfLife = randInt(3, 14);
                    const cycles = 2; // Fixed for 2 steps
                    const midTime = halfLife;
                    const finalTime = halfLife * 2;
                    const midMass = initial / 2;
                    const finalMass = initial / 4;
                    
                    p.fullStatement = MCF.pick([
                    `A radioactive isotope sample decays exponentially over time. Tracking logs demonstrate that an initial element mass of **${initial} g** decreases to exactly **${midMass} g** after **${midTime} hours**, and subsequently drops to **${finalMass} g** at the **${finalTime}-hour** mark. Determine the **half-life** of the substance.`,
                    `A radioactive sample decays over time. Records show that a starting mass of **${initial} g** decreases to exactly **${midMass} g** after **${midTime} hours**, and subsequently drops to **${finalMass} g** at the **${finalTime}-hour** mark. Determine the **half-life** of the substance.`,
                    `A scientist tracks a decaying sample. It begins at a mass of **${initial} g** decreases to exactly **${midMass} g** after **${midTime} hours**, and subsequently drops to **${finalMass} g** at the **${finalTime}-hour** mark. Determine the **half-life** of the substance.`
                ]);
                    p.prompt = mcfPick(["Select the half-life:", "How long does it take to halve?", "Pick the half-life time:"]);
                    const correctStr = `${halfLife} hours`;
                    const dist1 = `${halfLife / 2} hours`;
                    const dist2 = `${finalTime} hours`;
                    const dist3 = `${halfLife + 2} hours`;
                    const mc = shuffleMC(correctStr, [dist1, dist2, dist3]);
                    p.options = mc.options; p.ans = mc.ansLetter;
                    p.hint = "Half-life is defined as the time duration required for a decaying substance mass to decrease to exactly half of its initial value.";
                    p.steps = [
                        { title: `Step 1: Work Out What Half-Life Really Asks`, math: `\\(\\text{Initial Mass} = ${initial}\\text{ g} \\implies \\text{Target Half-Mass} = ${midMass}\\text{ g}\\)`, explanation: ( "Determine the mass value that represents exactly half of the initial sample size.") + ` Half-life is about how long it takes to halve. So look for where the amount drops to half, not at single values.`},
                        { title: "Step 2: Match It to the Times in the Table", math: `\\(\\text{Mass drops from } ${initial}\\text{ g} \\text{ to } ${midMass}\\text{ g} \\text{ at timestamp } t = ${midTime} \\text{ hours}\\)`, explanation: ( ( "Find the elapsed time required to reach the target half-mass value.") + ` Find two rows where the second amount is half the first, then look at the time between them. That gap is one half-life.`) + ` Find two rows where the second amount is half the first, then look at the time between them. That gap is one half-life.`},
                        { title: "Step 3: Confirm Consistent Decay Cycle Ratios", math: `\\(${midMass}\\text{ g} \\to ${finalMass}\\text{ g} \\quad (\\text{Another half reduction}) \\implies \\text{Takes another } ${halfLife} \\text{ hours } (${finalTime} - ${midTime} = ${halfLife})\\)`, explanation: ( ( "Verify the interval is consistent by checking the next reduction cycle.") + ` Check a different pair of rows and confirm the same gap. A real half-life stays the same no matter where in the table you look.`) + ` Check a different pair of rows and confirm the same gap. A real half-life stays the same no matter where in the table you look.`}
                    ];
                    break;
                }
            }
            return p;
        }

        function renderMathElements() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        window.onload = renderMathElements;

        function displaySolution() {
            document.getElementById("solution-reveal-layer").style.display = "none";
            var __hb = document.getElementById("hint-box"); if (__hb) __hb.style.display = "none";
            const placeholder = document.getElementById("placeholder");
            const quizStation = document.getElementById("quiz-station");
            const assetMount = document.getElementById("asset-viewport-mount-point");
            const mountPoint = document.getElementById("dynamic-input-mount-point");
            const promptLabel = document.getElementById("input-prompt-label");

            placeholder.style.display = "none";
            quizStation.style.display = "block";
            
            if (currentProblemData.assetType && currentProblemData.assetType !== "none") {
                assetMount.style.display = "flex";
                assetMount.innerHTML = currentProblemData.assetHtml;
            } else {
                assetMount.style.display = "none";
            }

            document.getElementById("question-statement-display").innerHTML = mcfRich(currentProblemData.fullStatement);
            promptLabel.innerHTML = mcfRich(currentProblemData.prompt);
            
            let html = '<div class="mc-options-list">';
            for (let i = 0; i < currentProblemData.options.length; i++) {
                const opt = currentProblemData.options[i];
                const letter = opt.charAt(0);
                const sel = currentState.selectedMcOption === letter ? "selected" : "";
                const dis = currentState.answered ? "disabled" : "";
                html += '<div class="mc-option-card ' + sel + ' ' + dis + '" onclick="selectMcOptionCard(\'' + letter + '\')"><span class="mc-badge">' + letter + '</span><span>' + opt.substring(3) + '</span></div>';
            }
            html += '</div>';
            mountPoint.innerHTML = html;

            if (currentState.answered) {
                lockQuizInterface(currentState.isCorrect);
                if (currentState.solRevealed) revealSolutionWorkspace();
            } else {
                unlockQuizInterface();
            }

            setTimeout(renderMathElements, 10);
        }

            fetch(TEACHER_SPREADSHEET_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Database cloud logging failure:", err));
        }
