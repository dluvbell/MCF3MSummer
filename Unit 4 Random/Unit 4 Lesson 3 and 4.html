    <script>

        /* ── mcf-core.js 로 옮겨간 이름들의 지역 별칭 ── */

        /* --- audit fix: uniform in-place shuffle (Fisher-Yates) --- */

           정답과 글자가 똑같은 보기를 골랐는데 오답 처리되는 것을 막는다. --- */
        /* Nudge one number inside an existing option to build a replacement

        const TEACHER_SPREADSHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwygR6-l7XPRC1KL-Pqci33Yw_4pmCWa8mW7gNHJ_RsmN41ax15-d0sE-CrIxU0z22m/exec";

        let currentProblemData = null;
        let currentState = { answered: false, selectedMcOption: "", isCorrect: false, currentStep: 0, solRevealed: false, attempts: 0 };

        // --- Math & Logic Utilities ---


        // --- Dynamic SVG Generators ---
        function drawDynamicTriangle(a, b, C_deg, labels, sideLabels, angleLabels) {
            let C_rad = C_deg * Math.PI / 180;
            let pts = [
                [0, 0],
                [a, 0],
                [b * Math.cos(C_rad), b * Math.sin(C_rad)]
            ];

            // Random rotation (0 to 360 degrees)
            let rot = Math.random() * Math.PI * 2;
            let cosR = Math.cos(rot), sinR = Math.sin(rot);
            pts = pts.map(p => [
                p[0]*cosR - p[1]*sinR,
                p[0]*sinR + p[1]*cosR
            ]);

            // Random flip
            if (Math.random() > 0.5) pts = pts.map(p => [-p[0], p[1]]);

            // Calculate Bounding Box
            let xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
            let minX = Math.min(...xs), maxX = Math.max(...xs);
            let minY = Math.min(...ys), maxY = Math.max(...ys);
            let w = maxX - minX, h = maxY - minY;

            // Scale to fit nicely inside 300x180 (usable area 200x120 to leave padding)
            let scale = Math.min(200 / (w || 1), 120 / (h || 1));
            
            // Center in SVG
            let cx_orig = (minX + maxX) / 2;
            let cy_orig = (minY + maxY) / 2;
            
            pts = pts.map(p => [
                (p[0] - cx_orig) * scale + 150,
                (p[1] - cy_orig) * scale + 90
            ]);

            let svg = '<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">';
            svg += `<polygon points="${pts[0][0]},${pts[0][1]} ${pts[1][0]},${pts[1][1]} ${pts[2][0]},${pts[2][1]}" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>`;

            let cx = (pts[0][0] + pts[1][0] + pts[2][0]) / 3;
            let cy = (pts[0][1] + pts[1][1] + pts[2][1]) / 3;

            // Angle labels (push outward from centroid)
            for (let i = 0; i < 3; i++) {
                if (angleLabels[i]) {
                    let p = pts[i];
                    let dx = cx - p[0], dy = cy - p[1], len = Math.hypot(dx, dy);
                    let tx = p[0] + (dx/len)*25, ty = p[1] + (dy/len)*25 + 4;
                    svg += `<text x="${tx}" y="${ty}" font-family="Arial" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">${angleLabels[i]}</text>`;
                }
            }
            // Vertex labels (push further outward)
            for (let i = 0; i < 3; i++) {
                if (labels[i]) {
                    let p = pts[i], dx = p[0] - cx, dy = p[1] - cy, len = Math.hypot(dx, dy);
                    let tx = p[0] - (dx/len)*18, ty = p[1] - (dy/len)*18 + 5; // Negative to push OUT
                    svg += `<text x="${tx}" y="${ty}" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">${labels[i]}</text>`;
                }
            }
            // Side labels (midpoint pushed outward)
            for (let i = 0; i < 3; i++) {
                if (sideLabels[i]) {
                    let p1 = pts[i], p2 = pts[(i+1)%3];
                    let mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
                    let dx = mx - cx, dy = my - cy, len = Math.hypot(dx, dy);
                    let tx = mx + (dx/len)*18, ty = my + (dy/len)*18 + 4; // Positive to push OUT from centroid
                    let fw = sideLabels[i].includes('?') ? 'bold' : 'normal';
                    let col = sideLabels[i].includes('?') ? '#0f172a' : '#334155';
                    svg += `<text x="${tx}" y="${ty}" font-family="Arial" font-size="13" font-weight="${fw}" fill="${col}" text-anchor="middle">${sideLabels[i]}</text>`;
                }
            }
            svg += '</svg>';
            return svg;
        }

        function buildSinusoidalSVG(spec) {
            const xmin = spec.xmin, xmax = spec.xmax;
            const ymin = spec.ymin, ymax = spec.ymax;
            const W = 300, H = 180, pad = 20;

            const X = function(x) { return pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad); };
            const Y = function(y) { return pad + (ymax - y) / (ymax - ymin) * (H - 2 * pad); };

            let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" class="coord-svg">';
            
            const xStep = spec.period / 2;
            for (let gx = xmin; gx <= xmax; gx += xStep) {
                s += `<line x1="${X(gx)}" y1="${Y(ymax)}" x2="${X(gx)}" y2="${Y(ymin)}" stroke="#e2e8f0" stroke-width="1"/>`;
            }
            for (let gy = Math.ceil(ymin); gy <= ymax; gy++) {
                s += `<line x1="${X(xmin)}" y1="${Y(gy)}" x2="${X(xmax)}" y2="${Y(gy)}" stroke="#e2e8f0" stroke-width="1"/>`;
            }

                const d_dir = Math.random() > 0.5 ? "right" : "left";
                const c_val = randInt(1, 6);
                const c_dir = Math.random() > 0.5 ? "up" : "down";
                
                const a_sign = isReflected ? "-" : "";
                const d_sign = d_dir === "right" ? "-" : "+";
                const c_sign = c_dir === "up" ? "+" : "-";

                const correctEq = `y = ${a_sign}${a_vals[a_idx]}\\sin(x ${d_sign} ${d_val}^\\circ) ${c_sign} ${c_val}`;
                const wrongD_sign = d_dir === "right" ? "+" : "-";
                const wrongC_sign = c_dir === "up" ? "-" : "+";
                const wrongA_sign = isReflected ? "" : "-";

                const dist1 = `y = ${wrongA_sign}${a_vals[a_idx]}\\sin(x ${d_sign} ${d_val}^\\circ) ${c_sign} ${c_val}`;
                const dist2 = `y = ${a_sign}${a_vals[a_idx]}\\sin(x ${wrongD_sign} ${d_val}^\\circ) ${c_sign} ${c_val}`;
                const dist3 = `y = ${a_sign}${a_vals[a_idx]}\\sin(x ${d_sign} ${d_val}^\\circ) ${wrongC_sign} ${c_val}`;

                const mc = shuffleMC(`\\(${correctEq}\\)`, [`\\(${dist1}\\)`, `\\(${dist2}\\)`, `\\(${dist3}\\)`]);
                p.options = mc.options; p.ans = mc.ansLetter;
                
                /* audit fix: the statement is injected with innerHTML, so "\n" collapsed and all
                   four bullets ran together on one line. Use <br>. Also "1 units" -> "1 unit". */
                const c_unit = (Math.abs(c_val) === 1) ? 'unit' : 'units';
                p.fullStatement = `Write the equation of a sine function with the following properties:<br>&bull; ${a_texts[a_idx]}<br>${isReflected ? '&bull; Reflected in the x-axis<br>' : ''}&bull; Phase shift \\(${d_val}^\\circ\\) ${d_dir}<br>&bull; Translated \\(${c_val}\\) ${c_unit} ${c_dir}`;
                p.prompt = mcfPick([
                    "Select the correct equation:",
                    "Which equation has all three of these features?",
                    "Pick the sine equation that matches the list:"
                ]);
                p.hint = `General form: \\(y = a\\sin(x - d) + c\\). Check signs for reflection, left/right shifts, and up/down shifts.`;
                p.steps = [
                    { title: "Step 1: Find the Number in Front (a)", math: `\\(a = ${a_sign}${a_vals[a_idx]}\\)`, explanation: `The size of \\(a\\) is the stretch: bigger than 1 makes the wave taller, smaller than 1 flattens it. The sign is separate. ${isReflected ? "A reflection in the x-axis flips the wave upside down, which is what the minus sign does." : "There is no reflection here, so a stays positive."}` },
                    { title: "Step 2: Find the Sideways Shift (d)", math: `\\(d = ${d_dir === 'right' ? '+' : '-'}${d_val}^\\circ \\implies (x ${d_sign} ${d_val}^\\circ)\\)`, explanation: `This is the one that catches people out: inside the bracket the sign is the opposite of the direction. Shifting ${d_dir} by ${d_val}° gives \\((x ${d_sign} ${d_val}^\\circ)\\). ${d_dir === 'right' ? "Right means you subtract inside the bracket." : "Left means you add inside the bracket."}` },
                    { title: "Step 3: Find the Up or Down Shift (c)", math: `\\(c = ${c_sign}${c_val}\\)`, explanation: `The number on its own at the end lifts or drops the whole wave, taking the middle line with it. Moving ${c_dir} by ${c_val} ${c_unit} means \\(c = ${c_sign}${c_val}\\). Unlike the bracket, this sign matches the direction: ${c_dir} really does mean ${c_sign === '-' ? "minus" : "plus"}.` },
                    { title: "Step 4: Put the Three Pieces Together", math: `\\(${correctEq}\\)`, explanation: "Slot each piece into its place in \\(y = a\\sin(x - d) + c\\). The stretch goes in front, the sideways shift inside the bracket, the up-or-down shift on the end. Compare the sign inside your bracket against the wrong answers, since that is usually the only difference between them." }
                ];
            }
            else if (typeId === "u4_t5") {
                p.title = "Amplitude & Range of Sinusoidal Functions";
                
                const a_raw = [2, 3, 4, 5, 0.5, 1.5, 2.5][randInt(0, 6)];
                const isNeg = Math.random() > 0.5;
                const a_str = isNeg ? `-${a_raw}` : `${a_raw}`;
                const c = randInt(-6, 6);
                const d = randInt(10, 80);
                const d_sign = Math.random() > 0.5 ? "+" : "-";

                const amp = Math.abs(a_raw);
                const max = c + amp;
                const min = c - amp;

                const correctStr = `Amplitude: \\(${amp}\\), Range: \\(\\{y \\in \\mathbb{R} \\mid ${min} \\le y \\le ${max}\\}\\)`;
                const dist1 = `Amplitude: \\(${a_str}\\), Range: \\(\\{y \\in \\mathbb{R} \\mid ${min} \\le y \\le ${max}\\}\\)`;
                const dist2 = `Amplitude: \\(${amp}\\), Range: \\(\\{y \\in \\mathbb{R} \\mid ${c} \\le y \\le ${max + amp}\\}\\)`;
                const dist3 = `Amplitude: \\(${amp*2}\\), Range: \\(\\{y \\in \\mathbb{R} \\mid ${min} \\le y \\le ${max}\\}\\)`;

                const mc = shuffleMC(correctStr, [dist1, dist2, dist3]);
                p.options = mc.options; p.ans = mc.ansLetter;
                
                p.fullStatement = `Given the equation of the sinusoidal function \\(y = ${a_str}\\sin(x ${d_sign} ${d}^\\circ) ${c >= 0 ? '+ '+c : '- '+Math.abs(c)}\\), determine its correct amplitude and range.`;
                p.prompt = mcfPick([
                    "Select the correct amplitude and range:",
                    "Which pair gives the amplitude and the range?",
                    "Pick the matching amplitude and range:"
                ]);
                p.hint = `Amplitude is always positive: \\(A = |a|\\). Midline is \\(y = c\\). Max = \\(c + A\\), Min = \\(c - A\\).`;
                p.steps = [
                    { title: "Step 1: Find the Amplitude", math: `\\(\\text{Amplitude} = |a| = |${a_str}| = ${amp}\\)`, explanation: `Look at the number sitting in front of the sine, which is ${a_str}, and drop the sign. Amplitude is a distance from the middle line up to a peak, and a distance is never negative. ${String(a_str).indexOf("-") === 0 ? "The minus only flips the wave upside down; it does not change how tall it is." : "There is no minus here, so nothing changes."}` },
                    { title: "Step 2: Find the Middle Line", math: `\\(c = ${c} \\implies \\text{Midline } y = ${c}\\)`, explanation: `The number tacked on the end, ${c}, is the height the wave is centred on. Without it the wave would sit around \\(y = 0\\). With it the whole picture slides up or down to \\(y = ${c}\\).` },
                    { title: "Step 3: Find the Highest and Lowest Points", math: `\\(\\text{Max} = ${c} + ${amp} = ${max}, \\quad \\text{Min} = ${c} - ${amp} = ${min}\\)`, explanation: `The wave climbs ${amp} above the middle line and drops ${amp} below it, and never goes past either. So the top is ${c} + ${amp} = ${max} and the bottom is ${c} - ${amp} = ${min}.` },
                    { title: "Step 4: Write the Range in Set Notation", math: `\\(\\text{Range: } \\{y \\in \\mathbb{R} \\mid ${min} \\le y \\le ${max}\\}\\)`, explanation: `The range is every height the wave actually reaches, so it runs from the lowest point to the highest. Read the notation as: all real numbers y such that y sits between ${min} and ${max}. Both ends are included, because the wave really does touch its peak and its trough.` }
                ];
            }

            return p;
        }

        // --- Core Application Logic ---

        function renderMathElements() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        window.onload = renderMathElements;

        function displaySolution() {
            document.getElementById("solution-reveal-layer").style.display = "none";
            var __hb = document.getElementById("hint-box"); if (__hb) __hb.style.display = "none";
            const placeholder = document.getElementById("placeholder");
            const quizStation = document.getElementById("quiz-station");
            const assetMount = document.getElementById("asset-viewport-mount-point");
            const mountPoint = document.getElementById("dynamic-input-mount-point");
            const promptLabel = document.getElementById("input-prompt-label");

            placeholder.style.display = "none";
            quizStation.style.display = "block";
            
            if (currentProblemData.assetType && currentProblemData.assetType !== "none") {
                assetMount.style.display = "flex";
                assetMount.innerHTML = currentProblemData.assetHtml;
            } else {
                assetMount.style.display = "none";
            }

            document.getElementById("question-statement-display").innerHTML = currentProblemData.fullStatement;
            promptLabel.innerHTML = currentProblemData.prompt;
            
            let html = '<div class="mc-options-list' + (currentProblemData.optionType === "graph" ? ' graph-grid' : '') + '">';
            for (let i = 0; i < currentProblemData.options.length; i++) {
                const opt = currentProblemData.options[i];
                const letter = opt.charAt(0);
                const sel = currentState.selectedMcOption === letter ? "selected" : "";
                const dis = currentState.answered ? "disabled" : "";
                const isGraph = currentProblemData.optionType === "graph";
                const body = isGraph ? ('<div class="option-graph">' + buildSinusoidalSVG(currentProblemData.optionSpecs[i]) + '</div>') : ('<span>' + opt.substring(3) + '</span>');
                
                html += '<div class="mc-option-card ' + sel + ' ' + dis + (isGraph ? ' graph-card' : '') + '" onclick="selectMcOptionCard(\'' + letter + '\')"><span class="mc-badge">' + letter + '</span>' + body + '</div>';
            }
            html += '</div>';
            mountPoint.innerHTML = html;

            if (currentState.answered) {
                lockQuizInterface(currentState.isCorrect);
                if (currentState.solRevealed) revealSolutionWorkspace();
            } else {
                unlockQuizInterface();
            }

            setTimeout(renderMathElements, 10);
        }




        function transmitDataToTeacherSpreadsheet(payload) {
            fetch(TEACHER_SPREADSHEET_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Database cloud logging failure:", err));
        }









        function updateHudScoreboard() {
            document.getElementById("hud-score").innerText = globalScore;
            document.getElementById("hud-attempts").innerText = globalAttempts;
        }
    

        MCF.init({ generate: generateProblem,
                   /* 그래프 보기는 optionSpecs 를 buildSinusoidalSVG 로 그린다 */
                   renderOption: function (p, i) {
                     return (p.optionSpecs && p.optionSpecs[i]) ? buildSinusoidalSVG(p.optionSpecs[i]) : "";
                   },
                   logUrl: (typeof TEACHER_SPREADSHEET_SCRIPT_URL !== "undefined" ? TEACHER_SPREADSHEET_SCRIPT_URL : null),
                   unitId: "Unit_4", lessonId: "Lesson_3_and_4" });
</script>
